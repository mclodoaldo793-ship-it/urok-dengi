<style>
/* Phone page: one big card at a time, thumb-sized buttons, same mint-banknote palette as the lesson */
:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1511; --surface:#12241C; --surface-2:#172D23; --ink:#E6F0E7; --ink-2:#B2C5B9; --muted:#87A093;
    --line:rgba(230,240,231,.12); --line-2:rgba(230,240,231,.26);

    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1511; --surface:#12241C; --surface-2:#172D23; --ink:#E6F0E7; --ink-2:#B2C5B9; --muted:#87A093;
  --line:rgba(230,240,231,.12); --line-2:rgba(230,240,231,.26);

}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.ph{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.ph-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.ph-logo{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);font-weight:800}
.ph-title{font-family:var(--font-display);font-weight:700;font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-net{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ph-net.ok{color:var(--ok)}
.ph-main{flex:1;width:min(560px,100%);margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}

h1{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.2;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.center{text-align:center;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}

.bad{color:var(--bad)}

.eyes{animation:look 3s ease-in-out infinite}

.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line-2);border-top-color:var(--brand);animation:spin 1s linear infinite}

.pp-q{font-size:21px}
.pp-opts{display:flex;flex-direction:column;gap:10px}

.pp-o.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}

.pg{display:flex;flex-direction:column;gap:12px}

.pg-send{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;padding:10px 0 12px;background:linear-gradient(transparent,var(--bg) 30%)}

.score{display:flex;flex-direction:column;gap:8px;width:100%}

.pres-p.down{color:var(--bad)}
.pres-o{padding-top:10px;border-top:1px solid var(--line);width:100%;color:var(--muted);font-size:14px}
.pres-hit{font-weight:700;color:var(--bad)}

.cf-outs{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--cf-muted)}

.cf-o{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 6px;border-radius:12px;background:color-mix(in srgb,var(--cf-acc) 8%,var(--cf-bg2));border:1px solid var(--cf-line);text-align:center}
.cf-o small{font-size:13px;font-weight:700;color:var(--cf-muted)}
.cf-o b{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--cf-good);white-space:nowrap}
.cf-o span{font-size:13px}
.cf-o.bad b{color:var(--cf-evil)}
/* cards: help for you / harm for the rival; each card spells out what it does */
.cf-cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.cf-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.cf-g{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

.cf-c.on.good{border-color:var(--cf-good);background:color-mix(in srgb,var(--cf-good) 16%,var(--cf-bg2))}

@container (min-width:400px){ .cf-o b{font-size:22px} }
@container (min-width:520px){
  .cf-prices{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
  .cf .cf-p{font-size:20px}
  .cf-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cf-o b{font-size:26px}
}

<script>
/* ================= MQ: tiny MQTT 3.1.1 client over WebSocket (QoS 0 only) ================= */
/* Used by the presenter page and the phone page to talk through public brokers. */
const MQ = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const u16 = n => [n >> 8 & 255, n & 255];
  const str = s => { const b = enc.encode(s); return [...u16(b.length), ...b]; };
  function varLen(n) { const out = []; do { let d = n % 128; n = Math.floor(n / 128); if (n) d |= 128; out.push(d); } while (n); return out; }
  function pkt(head, body) {
    const L = varLen(body.length), out = new Uint8Array(1 + L.length + body.length);
    out[0] = head; out.set(L, 1); out.set(body, 1 + L.length);
    return out;
  }
  function publishPkt(topic, payload, retain) {
    const t = str(topic), p = enc.encode(payload), body = new Uint8Array(t.length + p.length);
    body.set(t, 0); body.set(p, t.length);
    return pkt(0x30 | (retain ? 1 : 0), body);
  }

  function connect(url, o) {
    let ws = null, ok = false, tries = 0, ping = 0, buf = new Uint8Array(0), pid = 1;
    const topics = new Set(o.subs || []), queue = [];
    const nextId = () => (pid = pid % 65535 + 1);
    const send = b => { try { ws && ws.readyState === 1 && ws.send(b); } catch (e) {} };
    const sub = t => { if (ok) send(pkt(0x82, [...u16(nextId()), ...str(t), 0])); };

    function open() {
      try { ws = new WebSocket(url, 'mqtt'); } catch (e) { return retry(); }
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => send(pkt(0x10, [...str('MQTT'), 4, 2, ...u16(60), ...str(o.id)]));
      ws.onmessage = e => { if (e.data instanceof ArrayBuffer) feed(new Uint8Array(e.data)); };
      ws.onerror = () => { try { ws.close(); } catch (e) {} };
      ws.onclose = () => {
        const was = ok; ok = false; ws = null; buf = new Uint8Array(0);
        clearInterval(ping);
        if (was) o.onState?.(false);
        retry();
      };
    }
    function retry() { setTimeout(open, Math.min(15000, 800 * 2 ** tries++) + Math.random() * 600); }
    function feed(chunk) {
      const b = new Uint8Array(buf.length + chunk.length); b.set(buf); b.set(chunk, buf.length); buf = b;
      while (buf.length >= 2) {
        let len = 0, mul = 1, i = 1, byte;
        do {
          if (i >= buf.length) return;
          byte = buf[i++]; len += (byte & 127) * mul; mul *= 128;
        } while (byte & 128 && i < 5);
        if (buf.length < i + len) return;
        handle(buf[0], buf.subarray(i, i + len));
        buf = buf.slice(i + len);
      }
    }
    function handle(h, p) {
      const type = h >> 4;
      if (type === 2) {                       // CONNACK
        if (p[1] !== 0) { try { ws.close(); } catch (e) {} return; }
        ok = true; tries = 0;
        topics.forEach(sub);
        while (queue.length) send(queue.shift());
        clearInterval(ping); ping = setInterval(() => send(new Uint8Array([0xC0, 0])), 25000);
        o.onState?.(true);
      } else if (type === 3) {                // PUBLISH
        const qos = h >> 1 & 3, tl = p[0] << 8 | p[1];
        const topic = dec.decode(p.subarray(2, 2 + tl));
        const body = dec.decode(p.subarray(2 + tl + (qos ? 2 : 0)));
        try { o.onMessage?.(topic, body); } catch (e) { console.error(e); }
      }
    }
    open();
    return {
      url,
      get ok() { return ok; },
      publish(t, s, retain) {
        const b = publishPkt(t, s, retain);
        if (ok) send(b); else { queue.push(b); if (queue.length > 20) queue.shift(); }
      },
      subscribe(t) { if (!topics.has(t)) { topics.add(t); sub(t); } },
      unsubscribe(t) { if (topics.delete(t) && ok) send(pkt(0xA2, [...u16(nextId()), ...str(t)])); }
    };
  }
  return { connect };
})();

const LIVE_NS = 'dengi-urok-v1';
const LIVE_BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
/* ================= COFFEE BATTLE: shared rules (presenter + phones) ================= */
const COFFEE = {

  },

  EVENTS: {

                x:'Кофе везут из Бразилии и платят за него долларами. Доллар вырос — чашка теперь обходится в 40 ₽.' },
    rain:     { e:'🌧️', t:'Ливень', n:42, cost:20, max:80,
                x:'Никто не хочет выходить из здания. Покупателей меньше обычного.' },
    stipend:  { e:'💸', t:'Пришла стипендия', n:72, cost:20, max:110,
                x:'У студентов появились деньги. Покупателей больше, и дорогой кофе их не пугает.' },
    blogger:  { e:'📱', t:'Блогер против кофе', n:42, cost:20, max:60,
                x:'Популярный блогер сказал, что кофе вреден. Покупателей меньше, и платить много никто не хочет.' },
    cups:     { e:'🥤', t:'Оптовая скидка', n:60, cost:10, max:80,
                x:'Поставщик устроил распродажу зёрен и стаканчиков. Чашка обходится всего в 10 ₽.' },
    festival: { e:'🎉', t:'День студента', n:90, cost:20, max:100,
                x:'Праздник! В колледже концерт, кофе хотят почти все.' }
  }
};
/* the one market rule: the cheaper shop gets 2 of every 3 people, equal prices split in half */
const coffeeSplit = (n, mine, theirs) => mine < theirs ? Math.round(n * 2 / 3) : mine > theirs ? n - Math.round(n * 2 / 3) : n / 2;

/* ---------- order form: the same on the captain's phone and in the presenter's manual-entry window ---------- */
/* t: { cards:{id:true|false} }  ev: { n, cost, max }  init: last order  on: { change(order) } */
function coffeeForm(host, t, ev, init, on) {
  const C = COFFEE;
  const money = n => (n < 0 ? '−' : '+') + String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
  const o = { price: 60, card: null };
  if (init) ['price', 'card'].forEach(k => { if (k in init) o[k] = init[k]; });
  const fix = () => {
    if (o.price > ev.max) o.price = ev.max;
    if (o.card && !t.cards[o.card]) o.card = null;
  };
  /* what the team earns at its price for each guess about the rival: ready answers, no maths left for the class */
  function outcomes(unit) {
    const extra = (o.card === 'ad' ? C.AD : 0) + (o.card === 'rumor' ? C.RUMOR : 0), cases = [];
    if (o.price > C.PRICES[0]) cases.push(['Соперник дешевле', o.price - 10]);
    cases.push(['Цены равные', o.price]);
    if (o.price < ev.max) cases.push(['Соперник дороже', o.price + 10]);
    return cases.map(([s, rival]) => {
      const b = coffeeSplit(ev.n, o.price, rival) + extra, sum = b * (o.price - unit);
      return `<div class="cf-o ${sum < 0 ? 'bad' : ''}"><small>${s}</small><b>${money(sum)}</b><span>${b} ${plural(b, 'покупатель', 'покупателя', 'покупателей')}</span></div>`;
    }).join('');
  }
  function render() {
    fix();
    const ids = Object.keys(C.CARDS), unit = ev.cost - (o.card === 'discount' ? C.DISCOUNT : 0);
    const card = id => {
      const c = C.CARDS[id], used = !t.cards[id];
      return `<button type="button" class="cf-c ${c.good ? 'good' : 'evil'} ${o.card === id ? 'on' : ''} ${used ? 'used' : ''}" data-card="${id}" ${used ? 'disabled' : ''}><span>${c.e}</span><b>${c.n}</b><small>${used ? 'Уже сыграна' : c.d}</small></button>`;
    };
    const col = (good, title) => `<div class="cf-col ${good ? 'good' : 'evil'}"><span class="cf-g">${title}</span>${ids.filter(id => C.CARDS[id].good === good).map(card).join('')}</div>`;
    /* prices above the day's ceiling are not shown at all: nobody would buy */
    const top = ev.max < C.PRICES[C.PRICES.length - 1] ? ` <em>· дороже ${ev.max} ₽ не купят</em>` : '', left = o.price - unit;
    const note = left > 0 ? `С каждой чашки останется <b>${left} ₽</b>: цена ${o.price} ₽ минус ${unit} ₽ на кофе`
      : left === 0 ? `С чашки не останется <b>ничего</b>: цена ${o.price} ₽ и кофе обходится в ${unit} ₽`
      : `Каждая чашка <b class="bad">в убыток на ${-left} ₽</b>: цена ${o.price} ₽, а кофе обходится в ${unit} ₽`;
    host.innerHTML = `<div class="cf">
      <p class="cf-goal">Выберите <b>цену чашки</b>. Карту можно не брать.</p>
      <div class="cf-sec"><div class="cf-t"><i>1</i><span>Цена чашки${top}</span></div>
        <div class="cf-prices">${C.PRICES.filter(p => p <= ev.max).map(p => `<button type="button" class="cf-p ${p === o.price ? 'on' : ''}" data-p="${p}">${p} ₽</button>`).join('')}</div>
        <p class="cf-note">${note}</p>
        <div class="cf-outs"><span>Сколько заработаете за раунд:</span><div>${outcomes(unit)}</div></div></div>
      <div class="cf-sec"><div class="cf-t"><i>2</i><span>Карта <em>· по желанию, каждая — один раз за игру</em></span></div>
        <div class="cf-cards">${col(true, 'Помощь себе')}${col(false, 'Пакость сопернику')}</div></div>
    </div>`;
  }
  host.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled || !host.contains(b)) return;
    if (b.dataset.p) o.price = +b.dataset.p;
    else if (b.dataset.card) o.card = o.card === b.dataset.card ? null : b.dataset.card;
    else return;
    render(); on.change?.({ ...o });
  });
  render();
  return {
    get value() { fix(); return { ...o }; },
    update(nt, nev) { t = nt; if (nev) ev = nev; render(); }
  };
}
/* ================= PHONE: the student's screen ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const fmt = n => (n < 0 ? '−' : '') + String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const plural = (n, one, few, many) => { n = Math.abs(n) % 100; const d = n % 10; if (n > 10 && n < 20) return many; if (d > 1 && d < 5) return few; if (d === 1) return one; return many; };
const ls = {
  get(k) { try { return localStorage.getItem('dengi-p:' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('dengi-p:' + k, v); } catch (e) {} }
};

let cid = ls.get('cid');
if (!/^p[a-z0-9]{8,24}$/.test(cid || '')) { cid = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); ls.set('cid', cid); }
const readCode = () => (location.hash.slice(1) || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
let code = readCode(), S = null, lastTs = 0, nonce = 0, t0 = Date.now(), lastPoll = '';
let votes = {}; try { votes = JSON.parse(ls.get('votes') || '{}') || {}; } catch (e) {}
let viewer = ls.get('viewer') === '1';
let form = null, formKey = '', sentOid = null, dirty = false;
const main = $('#main');
const tS = () => `${LIVE_NS}/${code}/s`, tI = () => `${LIVE_NS}/${code}/i`;

/* ---------- connection ---------- */
const conns = [];
function onMessage(topic, payload) {
  if (topic !== tS()) return;
  if (payload === '') { S = { mode:'gone' }; lastTs = 0; return render(); }
  let m; try { m = JSON.parse(payload); } catch (e) { return; }
  if (!m || m.v !== 1 || typeof m.ts !== 'number' || m.ts < lastTs) return;
  lastTs = m.ts; S = m; render();
}
function send(t, data) {
  const n = Date.now().toString(36) + (++nonce);
  const msg = JSON.stringify({ c: cid, n, t, ...data });
  conns.forEach(c => c.publish(tI(), msg, false));
  return n;
}
function hi() {
  const p = S && S.mode === 'poll' && S.poll;
  send('hi', p && votes[p.id] ? { p: p.id, k: votes[p.id] } : {});
}
function connect() {
  if (conns.length || !code) return;
  LIVE_BROKERS.forEach((url, k) => conns.push(MQ.connect(url, {
    id: cid.slice(0, 14) + k + Math.random().toString(36).slice(2, 6), subs: [tS()], onMessage,
    onState: ok => { net(); if (ok) hi(); }
  })));
  setInterval(hi, 15000);
  setInterval(() => { if (!S) render(); net(); }, 3000);
}
function net() {
  const up = conns.some(c => c.ok);
  const el = $('#net');
  el.textContent = !code ? '' : up ? '● на связи' : '○ подключаемся…';
  el.className = 'ph-net ' + (up ? 'ok' : '');
}
window.addEventListener('hashchange', () => {
  const c = readCode(); if (!c || c === code) return;
  conns.forEach(k => k.unsubscribe(tS()));
  code = c; S = null; lastTs = 0;
  conns.length ? conns.forEach(k => k.subscribe(tS())) : connect();
  render();
});

/* ---------- screens ---------- */
function join() {
  main.innerHTML = `<div class="card center">
    <div class="big-e">🔑</div>
    <h1>Введите код урока</h1>
    <p class="muted">Код написан на экране под QR-кодом.</p>
    <form id="joinF" class="join"><input id="joinIn" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE" aria-label="Код урока"><button class="btn">Войти</button></form>
  </div>`;
  $('#joinF').addEventListener('submit', e => { e.preventDefault(); const v = $('#joinIn').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (v.length === 5) location.hash = v; });
}
function waiting() {
  const slow = Date.now() - t0 > 9000;
  main.innerHTML = `<div class="card center"><div class="spin"></div>
    <h1>${slow ? 'Ищем урок…' : 'Подключаемся…'}</h1>
    <p class="muted">${slow ? 'Проверьте интернет. Если ведущий ещё не открыл урок, страница подключится сама, как только он начнёт.' : 'Секунду.'}</p>
    <p class="muted small">Код урока: <b>${esc(code)}</b></p></div>`;
}
function idle(gone) {
  main.innerHTML = gone
    ? `<div class="card center"><div class="big-e">🔄</div><h1>Ведущий сменил код</h1><p class="muted">Отсканируйте новый QR-код с экрана.</p></div>`
    : `<div class="card center"><div class="big-e eyes">👀</div><h1>Смотрите на экран</h1><p class="muted">Когда ведущий откроет вопрос, голосование появится здесь само. Страницу можно не закрывать.</p></div>`;
}
function poll(p) {
  if (p.id !== lastPoll) { lastPoll = p.id; try { navigator.vibrate && navigator.vibrate(40); } catch (e) {} }
  const mine = votes[p.id], total = p.tally ? Object.values(p.tally).reduce((a, b) => a + b, 0) : 0;
  const right = p.opts.find(o => o.k === p.answer);
  let st = mine ? '✓ Голос принят. Можно передумать, пока не открыли ответ.' : 'Выберите вариант 👇';
  if (p.rev && p.answer) st = mine === p.answer ? '🎉 Вы угадали!' : mine ? `Мимо! Правильный ответ: ${esc(right ? right.t : '')}` : `Правильный ответ: ${esc(right ? right.t : '')}`;
  main.innerHTML = `<div class="pp ${p.rev ? 'rev' : ''}">
    <p class="pp-sub">${esc(p.sub || 'Голосование')}</p>
    <h1 class="pp-q">${esc(p.q)}</h1>
    <div class="pp-opts">${p.opts.map(o => {
      let cls = mine === o.k ? 'on' : '';
      if (p.rev && p.answer) cls += o.k === p.answer ? ' right' : mine === o.k ? ' wrong' : ' dim';
      const pct = total ? Math.round((p.tally[o.k] || 0) / total * 100) : 0;
      return `<button class="pp-o ${cls}" data-k="${esc(o.k)}" ${p.rev ? 'disabled' : ''}>${p.rev && total ? `<i style="width:${pct}%"></i>` : ''}<span>${esc(o.t)}</span>${p.rev && total ? `<b>${pct}%</b>` : ''}</button>`;
    }).join('')}</div>
    <p class="pp-st ${p.rev && p.answer ? (mine === p.answer ? 'good' : 'bad') : ''}">${st}</p>
    ${p.n ? `<p class="muted small center">Уже проголосовали: ${p.n}</p>` : ''}
  </div>`;
}
main.addEventListener('click', e => {
  const o = e.target.closest('.pp-o'); if (!o || o.disabled || !S || !S.poll) return;
  const id = S.poll.id, k = o.dataset.k;
  votes[id] = k; ls.set('votes', JSON.stringify(votes));
  send('vote', { p: id, k });
  setTimeout(() => { if (votes[id] === k) send('vote', { p: id, k }); }, 1500);
  poll(S.poll);
});

/* ---------- coffee battle ---------- */
function game(g) {
  const me = g.teams.findIndex(t => t.cap === cid);
  if (me < 0) { form = null; formKey = ''; return viewer ? watch(g) : claim(g); }
  const t = g.teams[me];
  const head = `<div class="pg-team t${me}"><span>${t.emoji}</span><div><small>Телефон команды</small><b>${esc(t.name)}</b></div><b class="pg-money">${fmt(t.money)} ₽</b></div>`;
  if (g.phase === 'orders') {
    const key = `${g.round}:${me}`;
    if (formKey !== key) {
      formKey = key; sentOid = null; dirty = false;
      main.innerHTML = `<div class="pg">
        <div id="pgHead"></div>
        <div class="pg-news"><span class="pg-ne">${g.ev.e}</span><div><small>Раунд ${g.round} из ${g.rounds}</small><b>${esc(g.ev.t)}</b><p>${esc(g.ev.x)}</p><p class="pg-facts">👥 Кофе захотят <b>${g.ev.n} ${plural(g.ev.n, 'человек', 'человека', 'человек')}</b> · ☕ чашка обходится в <b>${g.ev.cost} ₽</b> · ${g.ev.max < COFFEE.PRICES[COFFEE.PRICES.length - 1] ? `дороже <b>${g.ev.max} ₽</b> не купят` : `купят даже за <b>${g.ev.max} ₽</b>`}</p></div></div>
        <div id="pform"></div>
        <div class="pg-send"><button class="btn big" id="pSend">Отправить решение</button><p id="pSt" class="muted center"></p></div>
      </div>`;
      form = coffeeForm($('#pform'), t, g.ev, null, {
        change() { dirty = true; status(g.teams[me]); }
      });
      $('#pSend').addEventListener('click', () => {
        const v = form.value; sentOid = send('order', { team: me, ...v }); dirty = false; status(S.game.teams[me]);
        setTimeout(() => { if (sentOid && S.game.teams[me].oid !== sentOid) sentOid = send('order', { team: me, ...form.value }); }, 2500);
      });
    } else form.update(t, g.ev);
    $('#pgHead').innerHTML = head;
    return status(t);
  }
  form = null; formKey = '';
  if (g.phase === 'lobby') {
    main.innerHTML = `<div class="pg">${head}<div class="card center"><div class="big-e">${t.emoji}</div><h1>Телефон подключён!</h1><p class="muted">Ждём начала игры. В каждом раунде команда вместе выбирает цену чашки и отправляет решение с этого телефона.</p><button class="btn ghost" id="pUncap">Сменить команду</button></div></div>`;
    $('#pUncap').addEventListener('click', () => send('uncap', {}));
  } else if (g.phase === 'reveal' && t.res) {
    /* the projector plays the show first; the phone keeps the result until it ends */
    const key = 'r' + g.round;
    if (revealKey !== key) { revealKey = key; revealAt = Date.now() + (g.show || 0); }
    clearTimeout(revealTimer);
    if (Date.now() < revealAt) {
      revealTimer = setTimeout(render, revealAt - Date.now() + 50);
      main.innerHTML = `<div class="card center"><div class="big-e drum">🥁</div><h1>Вскрываем решения!</h1><p class="muted">Смотрите на экран: там сейчас покажут цены и карты. Результат появится здесь.</p></div>`;
      return;
    }
    const r = t.res, o = g.teams[1 - me].res, bad = r.hit && COFFEE.CARDS[r.hit];
    const v = !o || r.profit === o.profit ? 0 : r.profit > o.profit ? 1 : -1;
    const sg = n => (n >= 0 ? '+' : '−') + fmt(Math.abs(n)) + '&nbsp;₽';
    main.innerHTML = `<div class="pg">${head}<div class="card center pres ${v > 0 ? 'win' : ''} ${bad && partyKey !== key ? 'hit' : ''}">
      <p class="pres-v">${v > 0 ? '🎉 Вы заработали больше соперника' : v < 0 ? 'Соперник заработал больше' : 'В этом раунде ничья'}</p>
      <div class="pres-p ${r.profit >= 0 ? 'up' : 'down'}">${sg(r.profit)}</div>
      <p>${r.sold} ${plural(r.sold, 'чашка', 'чашки', 'чашек')} × ${r.price - r.unit} ₽ с чашки${r.tax ? ` − ${fmt(r.tax)} ₽ налог` : ''}</p>
      <p class="muted">Цена ${r.price} ₽, кофе обошёлся в ${r.unit} ₽</p>
      ${bad ? `<p class="pres-hit">😈 Пакость соперника: ${bad.e} ${bad.n}</p>` : ''}
      ${o ? `<p class="pres-o">У соперника: <b>${sg(o.profit)}</b></p>` : ''}
    </div></div>`;
    if (partyKey !== key) { partyKey = key; if (v > 0) party(['🎉', '💰', '🪙', t.emoji]); else if (bad) buzz([90, 60, 90]); }
  } else if (g.phase === 'over') {
    const win = g.winner === me, draw = g.winner === -1;
    main.innerHTML = `<div class="pg">${head}<div class="card center ${win ? 'pres win' : ''}"><div class="big-e ${win ? 'champ' : ''}">${draw ? '🤝' : win ? '🏆' : '🥈'}</div>
      <h1>${draw ? 'Ничья!' : win ? 'Ваша кофейня победила!' : 'Второе место'}</h1>
      <p class="muted">В кассе в конце игры: <b>${fmt(t.final)}&nbsp;₽</b></p></div></div>`;
    if (partyKey !== 'over') { partyKey = 'over'; if (win) { party(['🏆', '🎉', '💰', '🥳', '🪙', t.emoji], 46); setTimeout(() => party(['🎊', '⭐', '💰'], 30), 1400); } }
  } else watch(g);
}
let revealKey = '', revealAt = 0, revealTimer = 0, partyKey = '';
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
/* emoji rain over the whole phone screen */
function party(set, n = 30) {
  buzz([60, 40, 140]);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div');
  box.className = 'party';
  box.innerHTML = Array.from({ length: n }, (_, k) => `<i style="left:${(Math.random() * 96).toFixed(1)}%;font-size:${22 + Math.round(Math.random() * 20)}px;animation-delay:${(Math.random() * .9).toFixed(2)}s;animation-duration:${(1.8 + Math.random() * 1.5).toFixed(2)}s">${set[k % set.length]}</i>`).join('');
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4500);
}
function status(t) {
  const el = $('#pSt'); if (!el) return;
  if (sentOid && t.oid === sentOid && !dirty) el.innerHTML = '<b class="good">✅ Решение принято.</b> Можно поменять и отправить снова, пока ведущий не вскрыл решения.';
  else if (sentOid && dirty) el.textContent = 'Есть изменения — нажмите «Отправить решение» ещё раз.';
  else if (sentOid) el.textContent = 'Отправляем…';
  else el.textContent = t.ready ? 'Решение уже отправлено с другого устройства или ведущим.' : 'Соперники не видят ваше решение.';
}
function claim(g) {
  main.innerHTML = `<div class="card center"><div class="big-e">☕</div><h1>Битва кофеен</h1>
    <p class="muted">У каждой команды один телефон. За какую кофейню играет этот?</p>
    <div class="claim">${g.teams.map((t, i) => `<button class="btn big t${i}" data-claim="${i}" ${t.cap ? 'disabled' : ''}>${t.emoji} Мы — «${esc(t.name)}»${t.cap ? '<small>у команды уже есть телефон</small>' : ''}</button>`).join('')}</div>
    <button class="btn ghost" id="pWatch">Я просто смотрю 👀</button></div>`;
}
function watch(g) {
  main.innerHTML = `<div class="card center"><div class="big-e eyes">👀</div><h1>Смотрите на экран</h1>
    ${g.ev && g.phase !== 'over' ? `<p class="muted">Раунд ${g.round}: ${g.ev.e} ${esc(g.ev.t)}</p>` : ''}
    <div class="score">${g.teams.map((t, i) => `<div class="t${i}"><span>${t.emoji} ${esc(t.name)}</span><b>${fmt(g.phase === 'over' ? t.final : t.money)} ₽</b></div>`).join('')}</div>
    <button class="btn ghost" id="pBeCap">Выбрать команду</button></div>`;
}
main.addEventListener('click', e => {
  const c = e.target.closest('[data-claim]');
  if (c && !c.disabled) { viewer = false; ls.set('viewer', '0'); send('cap', { team: +c.dataset.claim }); c.textContent = 'Подключаем…'; setTimeout(render, 4000); }
  if (e.target.closest('#pWatch')) { viewer = true; ls.set('viewer', '1'); render(); }
  if (e.target.closest('#pBeCap')) { viewer = false; ls.set('viewer', '0'); render(); }
});

function render() {
  net();
  if (!code) return join();
  connect();
  if (!S) return waiting();
  if (S.mode === 'gone') return idle(true);
  if (S.mode !== 'game') { form = null; formKey = ''; }
  if (S.mode === 'poll' && S.poll) return poll(S.poll);
  if (S.mode === 'game' && S.game) return game(S.game);
  idle();
}

/* keep the screen awake during the lesson, where the browser allows it */
document.addEventListener('click', () => { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} }, { once: true });
render();
</script>
